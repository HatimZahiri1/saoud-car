{% extends 'core/admin/base_admin.html' %}
{% block title %}Paramètres de l'agence{% endblock %}

{% block content %}
<div class="admin-header">
    <div class="admin-header-title">
        <h1>Paramètres de l'agence</h1>
        <p>Informations affichées sur les contrats et factures.</p>
    </div>
</div>

<div class="admin-card">
    <form method="POST" class="admin-form">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Raison Sociale</label>
                <input type="text" name="name" value="{{ agency.name }}" required>
            </div>
            <div class="form-group">
                <label>Email de contact</label>
                <input type="email" name="email" value="{{ agency.email }}" required>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Téléphone Mobile</label>
                <input type="text" name="phone_mobile" value="{{ agency.phone_mobile }}" required>
            </div>
            <div class="form-group">
                <label>Téléphone Fixe</label>
                <input type="text" name="phone_fixed" value="{{ agency.phone_fixed }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Adresse complète</label>
            <input type="text" name="address" value="{{ agency.address }}" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Ville</label>
                <input type="text" name="city" value="{{ agency.city }}" required>
            </div>
            <div class="form-group">
                <label>Code postal</label>
                <input type="text" name="zip_code" value="{{ agency.zip_code }}" required>
            </div>
            <div class="form-group">
                <label>Pays</label>
                <input type="text" name="country" value="{{ agency.country }}" required>
            </div>
        </div>

        <h3 style="margin: 30px 0 15px 0;">Informations Légales</h3>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>ICE</label>
                <input type="text" name="ice" value="{{ agency.ice }}" required>
            </div>
            <div class="form-group">
                <label>Patente</label>
                <input type="text" name="patente" value="{{ agency.patente }}" required>
            </div>
            <div class="form-group">
                <label>RC</label>
                <input type="text" name="rc" value="{{ agency.rc }}" required>
            </div>
            <div class="form-group">
                <label>Identifiant Fiscal (IF)</label>
                <input type="text" name="if_tax" value="{{ agency.if_tax }}" required>
            </div>
            <div class="form-group">
                <label>CNSS</label>
                <input type="text" name="cnss" value="{{ agency.cnss }}" required>
            </div>
            <div class="form-group">
                <label>TVA (%)</label>
                <input type="number" name="tva" value="{{ agency.tva }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Site Web</label>
            <input type="text" name="website" value="{{ agency.website }}">
        </div>

        <div class="form-actions" style="margin-top: 30px;">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i data-lucide="save"></i> Enregistrer les paramètres
            </button>
        </div>
    </form>
</div>
{% endblock %}
