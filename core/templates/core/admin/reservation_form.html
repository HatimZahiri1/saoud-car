{% extends 'core/admin/base_admin.html' %}
{% block title %}{% if reservation %}Modifier Réservation{% else %}Nouvelle Réservation{% endif %}{% endblock %}

{% block content %}
<div class="admin-header">
    <div class="admin-header-title">
        <h1>{% if reservation %}Modifier Réservation{% else %}Nouvelle Réservation{% endif %}</h1>
    </div>
    <a href="{% url 'core:admin_reservations' %}" class="admin-btn">
        <i data-lucide="arrow-left"></i> Retour
    </a>
</div>

<div class="admin-card">
    <form method="POST" class="admin-form">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Client</label>
                <select name="client" required>
                    <option value="">Sélectionnez un client</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}" {% if reservation and reservation.client_id == client.id %}selected{% endif %}>
                        {{ client.full_name }} ({{ client.phone }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label>Voiture</label>
                <select name="car" required>
                    <option value="">Sélectionnez une voiture</option>
                    {% for car in cars %}
                    <option value="{{ car.id }}" {% if reservation and reservation.car_id == car.id %}selected{% endif %}>
                        {{ car.get_brand_display }} {{ car.name }} ({{ car.license_plate }})
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Date de début</label>
                <input type="date" name="start_date" value="{{ reservation.start_date|date:'Y-m-d'|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>Date de fin</label>
                <input type="date" name="end_date" value="{{ reservation.end_date|date:'Y-m-d'|default:'' }}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label>Statut</label>
            <select name="status" required>
                <option value="en_attente" {% if reservation and reservation.status == 'en_attente' %}selected{% endif %}>En attente</option>
                <option value="confirmee" {% if reservation and reservation.status == 'confirmee' %}selected{% endif %}>Confirmée</option>
                <option value="annulee" {% if reservation and reservation.status == 'annulee' %}selected{% endif %}>Annulée</option>
            </select>
        </div>

        <div class="form-group">
            <label>Notes / Observations</label>
            <textarea name="notes" rows="4">{{ reservation.notes }}</textarea>
        </div>

        <div class="form-actions" style="margin-top: 30px;">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i data-lucide="save"></i> Enregistrer
            </button>
        </div>
    </form>
</div>
{% endblock %}
