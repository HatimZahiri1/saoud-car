{% extends 'core/admin/base_admin.html' %}
{% block title %}{% if maintenance %}Modifier Vidange{% else %}Nouvelle Vidange{% endif %}{% endblock %}

{% block content %}
<div class="admin-header">
    <div class="admin-header-title">
        <h1>{% if maintenance %}Modifier Vidange{% else %}Nouvelle Vidange{% endif %}</h1>
    </div>
    <a href="{% url 'core:admin_maintenances' %}" class="admin-btn">
        <i data-lucide="arrow-left"></i> Retour
    </a>
</div>

<div class="admin-card">
    <form method="POST" class="admin-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Voiture</label>
            <select name="car" required>
                <option value="">Sélectionnez une voiture</option>
                {% for car in cars %}
                <option value="{{ car.id }}" {% if maintenance and maintenance.car_id == car.id %}selected{% endif %}>
                    {{ car.get_brand_display }} {{ car.name }} ({{ car.license_plate }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" value="{{ maintenance.date|date:'Y-m-d'|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>Coût (MAD)</label>
                <input type="number" step="0.01" name="cost" value="{{ maintenance.cost|default:'0' }}">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Kilométrage actuel</label>
                <input type="number" name="current_mileage" value="{{ maintenance.current_mileage|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>Prochaine vidange prévue (Km)</label>
                <input type="number" name="next_mileage" value="{{ maintenance.next_mileage|default:'' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Notes / Observations</label>
            <textarea name="notes" rows="4">{{ maintenance.notes }}</textarea>
        </div>

        <div class="form-actions" style="margin-top: 30px;">
            <button type="submit" class="admin-btn admin-btn-primary">
                <i data-lucide="save"></i> Enregistrer
            </button>
        </div>
    </form>
</div>
{% endblock %}
